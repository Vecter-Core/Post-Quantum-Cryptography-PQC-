name: CI

# Minutes matter (private repository: macOS counts 10x, Windows 2x). Every commit runs once:
# pull requests cover branches, pushes cover main. Documentation-only changes skip CI, a newer
# commit cancels the older run, and macOS/Windows run on main, weekly and on demand, not per
# pull request commit.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # On pull requests only Linux; see the note at the top.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: "1.85"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: matrix.toolchain == 'stable'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.toolchain == 'stable'
      - run: cargo test --workspace
        if: matrix.toolchain == 'stable'
      # MSRV: the library crates must keep building on the oldest supported compiler.
      # (vpqc-scan and vpqc-cli need 1.88 because of patched dependencies.)
      - run: cargo build -p vpqc-core -p vpqc-backend-libcrux -p vpqc-hybrid -p vpqc-format -p vpqc -p vpqc-ffi -p vpqc-jose -p vpqc-cose -p vpqc-ssh
        if: matrix.toolchain != 'stable'

  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run each target for 60 seconds from the seed corpus
        working-directory: fuzz
        run: |
          for t in parse_formats sealed_box stream signatures hpke scan jose x509 ssh cose; do
            mkdir -p corpus/$t
            # +nightly: rust-toolchain.toml pins stable. --target: the prebuilt cargo-fuzz is a
          # musl binary and would otherwise default to the musl target.
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" corpus/$t seeds/$t \
            -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  constant-time:
    name: secret independence (valgrind)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      # Deterministic, so it can gate. The timing (dudect) checks are too noisy for shared
      # runners and are run by hand, see tools/ct-check/README.md.
      - run: python3 tools/ct-check/grind.py

  jose:
    name: JOSE, COSE, X.509 and SSH interop (jose, cbor2 + OpenSSL, cryptography, Node.js, OpenSSH)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # WebCrypto ML-DSA needs >= 24.7
      - run: cargo build --release -p vpqc-cli
      - run: ./interop/jose.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # cryptography >= 50 ships OpenSSL with ML-DSA keys and X.509 support.
      - run: python -m pip install "cryptography>=50" "cbor2>=5.6"
      - run: PYTHON=python ./interop/x509.sh
      - run: PYTHON=python ./interop/cose.sh
      # Real OpenSSH servers, run unprivileged on loopback.
      - run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: ./interop/ssh.sh

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  bindings:
    name: bindings + interop
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bindings/python
            bindings/js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ffi
          ini-values: ffi.enable=1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      # Native artifacts
      - run: cargo build --release -p vpqc-cli -p vpqc-ffi -p vpqc-tls

      # C / C++ (ASan/UBSan on the smoke test)
      - run: sh crates/vpqc-ffi/tests/c/run.sh

      # Python
      - run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest
          (cd bindings/python && maturin develop --release && VPQC_CLI="$PWD/../../target/release/vpqc" pytest -q)

      # JavaScript / WebAssembly
      - run: |
          (cd bindings/js && sh scripts/build.sh && VPQC_CLI="$PWD/../../target/release/vpqc" node --test tests/*.test.js)

      # Go
      - run: |
          (cd bindings/go && go vet ./... && go test -race -count=1 ./... && go build -o ../../target/interop-go ./cmd/interop)

      # Java (Foreign Function & Memory API, JDK 21 preview)
      - run: |
          (cd bindings/java && mvn -B test && mvn -B -q package -DskipTests)

      # PHP (FFI)
      - run: |
          VPQC_LIBRARY="$PWD/target/release/libvpqc_ffi.so" php -d ffi.enable=1 bindings/php/tests/run.php

      # Ruby (ffi gem)
      - run: |
          gem install ffi --no-document
          VPQC_LIBRARY="$PWD/target/release/libvpqc_ffi.so" ruby -Ibindings/ruby/lib bindings/ruby/test/test_vpqc.rb

      # CBOM output must validate against the official CycloneDX 1.6 schema
      - run: |
          . .venv/bin/activate
          pip install jsonschema referencing
          mkdir -p /tmp/cdx && for f in bom-1.6.schema.json spdx.schema.json jsf-0.82.schema.json; do
            curl -sSfL -o /tmp/cdx/$f https://raw.githubusercontent.com/CycloneDX/specification/master/schema/$f
          done
          ./target/release/vpqc scan crates/vpqc-scan/tests/fixtures --format cbom -o /tmp/cbom.json
          python scripts/validate-cbom.py /tmp/cbom.json /tmp/cdx

      # Hybrid TLS against an independent stack (Go crypto/tls, X25519MLKEM768 only)
      - run: ./interop/tls.sh

      # Cross-language interoperability matrix (all implementations)
      - run: |
          . .venv/bin/activate
          PYTHON="$(which python)" INTEROP_JAVA=1 INTEROP_PHP=1 INTEROP_RUBY=1 ./interop/run.sh
