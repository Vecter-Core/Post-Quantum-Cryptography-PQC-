name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: "1.85"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: matrix.toolchain == 'stable'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.toolchain == 'stable'
      - run: cargo test --workspace

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  bindings:
    name: bindings + interop
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bindings/python
            bindings/js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      # Native artifacts
      - run: cargo build --release -p vpqc-cli -p vpqc-ffi

      # C / C++ (ASan/UBSan on the smoke test)
      - run: sh crates/vpqc-ffi/tests/c/run.sh

      # Python
      - run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest
          (cd bindings/python && maturin develop --release && VPQC_CLI="$PWD/../../target/release/vpqc" pytest -q)

      # JavaScript / WebAssembly
      - run: |
          (cd bindings/js && sh scripts/build.sh && VPQC_CLI="$PWD/../../target/release/vpqc" node --test tests/*.test.js)

      # Go
      - run: |
          (cd bindings/go && go vet ./... && go test -race -count=1 ./... && go build -o ../../target/interop-go ./cmd/interop)

      # Cross-language interoperability matrix
      - run: |
          . .venv/bin/activate
          PYTHON="$(which python)" ./interop/run.sh
