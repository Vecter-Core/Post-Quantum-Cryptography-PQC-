[package]
name = "vpqc-wasm"
description = "WebAssembly bindings for vpqc (browser, Node.js, Deno, edge runtimes)"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Vecter-Core/Post-Quantum-Cryptography-PQC-"
publish = false

[lib]
name = "vpqc_wasm"
crate-type = ["cdylib"]

[dependencies]
vpqc = { path = "../../crates/vpqc" }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
# Web Crypto backed randomness (this crate already depends on wasm-bindgen unconditionally).
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

# As in the workspace: no overflow checks inside the cryptographic dependencies, where they
# would add branches on secret data (see tools/ct-check/README.md).
[profile.release.package."*"]
overflow-checks = false
# vpqc's own crates are path dependencies here, not members: keep their checks.
[profile.release.package.vpqc]
overflow-checks = true
[profile.release.package.vpqc-backend-libcrux]
overflow-checks = true
[profile.release.package.vpqc-core]
overflow-checks = true
[profile.release.package.vpqc-format]
overflow-checks = true
[profile.release.package.vpqc-hpke]
overflow-checks = true
[profile.release.package.vpqc-hybrid]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
