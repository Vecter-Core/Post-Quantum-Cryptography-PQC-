vpqc-cose = { path = "../crates/vpqc-cose" }
vpqc-x509 = { path = "../crates/vpqc-x509" }
serde_json = "1"
vpqc-scan = { path = "../crates/vpqc-scan" }
vpqc-ssh = { path = "../crates/vpqc-ssh" }

