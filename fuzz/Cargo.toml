[package]
name = "vpqc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vpqc = { path = "../crates/vpqc" }
vpqc-core = { path = "../crates/vpqc-core" }
