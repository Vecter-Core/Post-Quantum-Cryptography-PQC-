[package]
name = "vpqc-tls"
description = "Hybrid post-quantum TLS 1.3 (X25519MLKEM768) configurations and a sidecar proxy for services that cannot be modified"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true

[dependencies]
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
rcgen = "0.14"

[[bin]]
name = "vpqc-tls-proxy"
path = "src/bin/proxy.rs"

[lints]
workspace = true
