[package]
name = "vpqc-cli"
description = "Command-line tool for vpqc: keygen, seal/open, sign/verify, inspect"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true

[[bin]]
name = "vpqc"
path = "src/main.rs"

[dependencies]
vpqc.workspace = true
vpqc-core.workspace = true
vpqc-format.workspace = true
vpqc-scan.workspace = true
vpqc-jose.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
